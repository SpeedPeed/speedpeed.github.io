<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#101828">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Car Evolve+</title>
<link rel="icon" href="icon.png">
<link rel="manifest" href="manifest.json">
<style>
:root{--bg:#101828;--panel:#1b2540;--panel2:#24305a;--acc:#ffb300;--acc2:#ff6f00;--ok:#43a047;--txt:#f5f7ff;--mut:#9aa6c8;--gem:#4dd0e1;--core:#e040fb}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:none}
canvas#game{position:fixed;inset:0;width:100%;height:100%;display:block}
button{font:inherit;color:inherit;border:0;cursor:pointer}
.hidden{display:none!important}
/* ---------- Steuerung ---------- */
#controls{position:fixed;inset:0;pointer-events:none}
.pedal{position:absolute;bottom:calc(14px + env(safe-area-inset-bottom));width:min(22vw,150px);height:min(34vh,150px);border-radius:22px;pointer-events:auto;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;letter-spacing:1px;box-shadow:0 6px 0 rgba(0,0,0,.35),inset 0 2px 0 rgba(255,255,255,.25);transition:transform .05s}
.pedal.on{transform:translateY(4px) scale(.97);box-shadow:0 2px 0 rgba(0,0,0,.35)}
#brake{left:calc(14px + env(safe-area-inset-left));background:linear-gradient(#ef5350,#b71c1c)}
#gas{right:calc(14px + env(safe-area-inset-right));background:linear-gradient(#66bb6a,#1b5e20)}
#nitroBtn{position:absolute;right:calc(min(22vw,150px) + 26px + env(safe-area-inset-right));bottom:calc(14px + env(safe-area-inset-bottom));width:min(14vw,90px);height:min(14vw,90px);border-radius:50%;background:radial-gradient(#64b5f6,#0d47a1);pointer-events:auto;font-weight:900;font-size:15px;box-shadow:0 5px 0 rgba(0,0,0,.35)}
#nitroBtn.off{filter:grayscale(1) brightness(.6)}
#pauseBtn{position:absolute;top:calc(10px + env(safe-area-inset-top));right:calc(12px + env(safe-area-inset-right));width:46px;height:46px;border-radius:12px;background:rgba(0,0,0,.45);pointer-events:auto;font-size:22px}
#hint{position:absolute;left:50%;top:42%;transform:translateX(-50%);background:rgba(0,0,0,.6);padding:10px 16px;border-radius:12px;font-weight:700;text-align:center;pointer-events:none;transition:opacity 1s;max-width:80vw}
/* ---------- Menü ---------- */
#menu{position:fixed;inset:0;display:flex;flex-direction:column;background:radial-gradient(ellipse at top,rgba(42,58,110,.82) 0%,rgba(16,24,40,.9) 70%);padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
#topbar{display:flex;align-items:center;gap:8px;padding:6px 10px;flex-wrap:wrap}
#logo{font-weight:900;font-size:22px;font-style:italic;letter-spacing:1px;background:linear-gradient(90deg,#ffd54f,#ff6f00);-webkit-background-clip:text;background-clip:text;color:transparent;margin-right:auto;white-space:nowrap}
.chip{background:rgba(0,0,0,.35);border-radius:20px;padding:4px 12px;font-weight:800;font-size:15px;white-space:nowrap}
#content{flex:1;overflow-y:auto;overflow-x:hidden;padding:4px 10px 10px;touch-action:pan-y;-webkit-overflow-scrolling:touch}
#tabs{display:flex;background:rgba(0,0,0,.4);padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;background:none;padding:6px 2px;font-size:11px;font-weight:700;color:var(--mut);position:relative;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
#tabs button span.i{font-size:20px;line-height:1.1}
#tabs button.act{color:#fff;background:rgba(255,255,255,.08)}
.badge{position:absolute;top:2px;right:calc(50% - 22px);background:#e53935;color:#fff;border-radius:10px;font-size:10px;padding:1px 5px;font-weight:900}
h2{margin:6px 0 8px;font-size:17px}
h3{margin:12px 0 6px;font-size:15px;color:var(--mut);text-transform:uppercase;letter-spacing:1px}
.row{display:flex;gap:10px;align-items:stretch;flex-wrap:wrap}
.card{background:var(--panel);border-radius:14px;padding:10px;box-shadow:0 3px 0 rgba(0,0,0,.25)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.btn{background:linear-gradient(#ffca28,#ff8f00);color:#3e2100;font-weight:900;border-radius:12px;padding:8px 12px;box-shadow:0 4px 0 #a64d00;font-size:14px;white-space:nowrap}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #a64d00}
.btn.green{background:linear-gradient(#81c784,#2e7d32);color:#fff;box-shadow:0 4px 0 #1b4d1e}
.btn.blue{background:linear-gradient(#64b5f6,#1565c0);color:#fff;box-shadow:0 4px 0 #0d3570}
.btn.purple{background:linear-gradient(#ce93d8,#7b1fa2);color:#fff;box-shadow:0 4px 0 #3f0d55}
.btn.gray,.btn:disabled{background:#455070;color:#aab;box-shadow:0 4px 0 #2a3048}
.btn.big{font-size:24px;padding:12px 30px;border-radius:16px}
.mut{color:var(--mut);font-size:12px}
.bar{height:8px;background:rgba(0,0,0,.4);border-radius:5px;overflow:hidden;margin-top:5px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ffca28,#ff6f00);border-radius:5px}
.up{display:flex;gap:8px;align-items:center}
.up .ic{font-size:26px;width:36px;text-align:center}
.up .tx{flex:1;min-width:0}
.up b{display:block;font-size:14px}
.lv{font-size:11px;color:var(--acc);font-weight:800}
.dots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap}
.dots i{width:5px;height:5px;border-radius:2px;background:rgba(255,255,255,.15)}
.dots i.f{background:var(--acc)}
#home{display:flex;gap:12px;align-items:stretch;flex-wrap:wrap}
#preview{width:100%;height:150px;display:block}
.vsel{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px;touch-action:pan-x}
.vcard{flex:0 0 130px;text-align:center;padding:6px;border:2px solid transparent;cursor:pointer}
.vcard.sel{border-color:var(--acc)}
.vcard canvas{width:120px;height:60px}
.wcard{position:relative;overflow:hidden;cursor:pointer;border:2px solid transparent;min-height:94px}
.wcard.sel{border-color:var(--acc)}
.wcard.lock{filter:grayscale(.8) brightness(.6)}
.wcard .wi{font-size:30px;position:absolute;right:10px;top:6px}
.swatch{width:42px;height:42px;border-radius:50%;border:3px solid transparent;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:900;margin:3px;cursor:pointer;vertical-align:top;position:relative}
.swatch.sel{border-color:#fff}
.swatch .pr{position:absolute;bottom:-6px;background:#000a;border-radius:6px;padding:0 3px;font-size:9px}
.ach{display:flex;align-items:center;gap:10px}
.ach .ic{font-size:28px}
.stars{color:var(--acc);letter-spacing:1px;font-size:12px}
/* ---------- Modals ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.65);display:flex;align-items:center;justify-content:center;z-index:20;padding:10px}
.modal .box{background:linear-gradient(#24305a,#16203d);border-radius:18px;padding:16px 18px;max-width:560px;width:100%;max-height:96%;overflow-y:auto;box-shadow:0 10px 40px rgba(0,0,0,.6);border:2px solid rgba(255,255,255,.08);touch-action:pan-y;text-align:center}
.modal h1{margin:0 0 6px;font-size:26px;font-weight:900}
.kv{display:flex;justify-content:space-between;padding:3px 0;border-bottom:1px dashed rgba(255,255,255,.1);font-size:14px}
.kv b{color:var(--acc)}
.total{font-size:30px;font-weight:900;color:#ffd54f;margin:8px 0}
.btnrow{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:12px}
textarea{width:100%;height:90px;background:#0b1224;color:#fff;border-radius:8px;border:1px solid #445;font-size:11px;user-select:text;-webkit-user-select:text}
.toggle{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid rgba(255,255,255,.08)}
#toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#000c;padding:8px 16px;border-radius:12px;font-weight:800;z-index:40;transition:opacity .4s;pointer-events:none;text-align:center}
@media (max-height:430px){#preview{height:120px}.btn.big{font-size:20px;padding:10px 24px}#logo{font-size:18px}.chip{font-size:13px;padding:3px 9px}}
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="controls" class="hidden">
  <button id="brake" class="pedal">BREMSE</button>
  <button id="nitroBtn">NITRO</button>
  <button id="gas" class="pedal">GAS</button>
  <button id="pauseBtn">⏸</button>
  <div id="hint" class="hidden"></div>
</div>

<div id="menu">
  <div id="topbar">
    <div id="logo">CAR EVOLVE+</div>
    <div class="chip" id="cCoins">🪙 0</div>
    <div class="chip" id="cGems" style="color:var(--gem)">💎 0</div>
    <div class="chip" id="cCores" style="color:var(--core)">🧬 0</div>
  </div>
  <div id="content"></div>
  <div id="tabs"></div>
</div>

<div id="modal" class="modal hidden"><div class="box" id="modalBox"></div></div>
<div id="toast" style="opacity:0"></div>

<script src="js/data.js"></script>
<script src="js/state.js"></script>
<script src="js/engine.js"></script>
<script src="js/render.js"></script>
<script src="js/audio.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
